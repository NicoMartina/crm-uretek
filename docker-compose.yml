services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: family_business_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./crmuretek
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db

  frontend:
    build: ./crmuretek-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: